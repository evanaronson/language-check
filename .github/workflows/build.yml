name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      # Surfaces compiler and Gradle errors as a single annotation on the run.
      - name: Summarize errors
        if: failure()
        run: |
          errors=$(grep -E -A12 '^e: |^\* What went wrong|FAILED$|^ERROR:' build.log | head -120)
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=Build errors::${errors}"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk language-check-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: language-check-${{ github.run_number }}
          path: language-check-${{ github.run_number }}.apk

      # A release gives a direct download link that works from the phone's browser.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment so quotes in commit messages can't break the command.
          NOTES: ${{ github.event.head_commit.message || 'Manual build' }}
        run: |
          gh release create "build-${{ github.run_number }}" "language-check-${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
