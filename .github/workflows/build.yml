name: Build APK

on:
  push:
    branches: [main]
    # Docs, design sources and the eval script don't change the app.
    paths-ignore:
      - README.md
      - brand/**
      - eval/**
  workflow_dispatch:

# One build at a time, so releases are published in push order and the newest is always "latest".
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleRelease 2>&1 | tee build.log

      # Surfaces compiler and Gradle errors as a single annotation on the run.
      - name: Summarize errors
        if: failure()
        run: |
          errors=$(grep -E -A12 '^e: |^\* What went wrong|FAILED$|^ERROR:' build.log | head -120)
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=Build errors::${errors}"

      # Builds of other branches (run by hand) go up as a pre-release, which never becomes "latest".
      - name: Publish pre-release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk linguize-branch-${{ github.run_number }}.apk
          gh release create "branch-${{ github.run_number }}" "linguize-branch-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Branch build ${{ github.run_number }} ($BRANCH)" \
            --notes "Built from $BRANCH" \
            --prerelease --latest=false

      # A release gives a direct download link that works from the phone's browser. The same
      # APK goes up under a fixed name, so releases/latest/download/linguize.apk is always the newest.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment so quotes in commit messages can't break the command.
          NOTES: ${{ github.event.head_commit.message || 'Manual build' }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk linguize-${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk linguize.apk
          gh release create "build-${{ github.run_number }}" "linguize-${{ github.run_number }}.apk" linguize.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "$NOTES" \
            --latest
