name: Build APK

on:
  push:
    branches: [main]
    # Docs, design sources and the eval script don't change the app.
    paths-ignore:
      - README.md
      - brand/**
      - eval/**
  workflow_dispatch:

# One build at a time, so releases are published in push order and the newest is always "latest".
concurrency:
  group: build
  cancel-in-progress: false

# Nothing by default; each job asks for what it needs.
permissions: {}

jobs:
  # Tests, builds and signs the APK. Read-only: it runs the build scripts and every
  # dependency, so it never holds a token that can write to the repo.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails the build if gradle-wrapper.jar isn't one Gradle published.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The release key lives only in secrets. Without them app/build.gradle.kts signs
      # with the debug key, which would never install over a real release, so stop here.
      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error title=Signing key missing::Set the SIGNING_* repository secrets (see README)."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.p12"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "SIGNING_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      # Surfaces compiler and Gradle errors as a single annotation on the run.
      - name: Summarize errors
        if: failure()
        run: |
          errors=$(grep -E -A12 '^e: |^\* What went wrong|FAILED$|^ERROR:' build.log | head -120)
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=Build errors::${errors}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  # Publishes what the build job made. The only job that can write to the repo, and it
  # runs no code from the repo.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk

      # Builds of other branches (run by hand) go up as a pre-release, which never becomes "latest".
      - name: Publish pre-release
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          apk="linguize-branch-$RUN.apk"
          mv app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "branch-$RUN" "$apk" "$apk.sha256" \
            --target "$SHA" \
            --title "Branch build $RUN ($BRANCH)" \
            --notes "Built from $BRANCH" \
            --prerelease --latest=false

      # A release gives a direct download link that works from the phone's browser. The same
      # APK goes up under a fixed name, so releases/latest/download/linguize.apk is always the newest.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          # Passed through the environment so quotes in commit messages can't break the command.
          NOTES: ${{ github.event.head_commit.message || 'Manual build' }}
        run: |
          mv app-release.apk "linguize-$RUN.apk"
          cp "linguize-$RUN.apk" linguize.apk
          sha256sum "linguize-$RUN.apk" > "linguize-$RUN.apk.sha256"
          sha256sum linguize.apk > linguize.apk.sha256
          gh release create "build-$RUN" "linguize-$RUN.apk" "linguize-$RUN.apk.sha256" linguize.apk linguize.apk.sha256 \
            --target "$SHA" \
            --title "Build $RUN" \
            --notes "$NOTES" \
            --latest
